name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  changes:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - id: base
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "sha=$tag" >> "$GITHUB_OUTPUT"

      - id: changed
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ steps.base.outputs.sha }}
          path: packages
          dir_names: true
          dir_names_max_depth: 1
          json: true
          escape_json: false

  release:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Bump version
        id: bump
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          PACKAGEJSON_DIR: packages/${{ matrix.package }}
          version-type: patch
          skip-commit: 'true'
          skip-tag: 'true'
          skip-push: 'true'

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          pnpm --filter "@terrafirmagreg-team/${{ matrix.package }}" pack --pack-destination "$RUNNER_TEMP/packed"
          mv "$RUNNER_TEMP"/packed/*.tgz "$RUNNER_TEMP/packed/pkg.tgz"

      - name: Publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: ${{ runner.temp }}/packed/pkg.tgz
          access: public
          provenance: true
          strategy: all

      - name: Upload bumped manifest
        run: |
          mkdir -p "out/${{ matrix.package }}"
          cp "packages/${{ matrix.package }}/package.json" "out/${{ matrix.package }}/package.json"

      - uses: actions/upload-artifact@v7
        with:
          name: bump-${{ matrix.package }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          pattern: bump-*
          path: bumped
          merge-multiple: true

      - name: Overlay bumped manifests
        run: |
          find bumped -type f
          for f in bumped/*/package.json; do
            pkg=$(basename "$(dirname "$f")")
            cp "$f" "packages/$pkg/package.json"
          done

      - name: Commit version bumps
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(release): bump versions [skip ci]'
          file_pattern: 'packages/*/package.json'
          branch: main

  github-release:
    needs: [changes, commit]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}

      - name: Tag
        id: ver
        run: echo "tag=${{ matrix.package }}@$(node -p "require('./packages/${{ matrix.package }}/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ needs.commit.outputs.sha }}
          generate_release_notes: true
